services:
  # Base de données PostgreSQL
  db:
    image: postgres:15-alpine
    container_name: pwa_db
    restart: always
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME:-strapi}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-strapi_pw}
      POSTGRES_DB: ${DATABASE_NAME:-strapi_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - pwa_network

  # Backend Strapi (Headless CMS)
  backend:
    build: ./backend
    container_name: pwa_backend
    restart: always
    environment:
      DATABASE_CLIENT: postgres
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_NAME: ${DATABASE_NAME:-strapi_db}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-strapi}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-strapi_pw}
      NODE_ENV: development
    volumes:
      - ./backend:/opt/app
      - /opt/app/node_modules
    ports:
      - "1337:1337"
    depends_on:
      - db
    networks:
      - pwa_network

  # Frontend Vue.js 3 / Vite
  frontend:
    build: ./frontend
    container_name: pwa_frontend
    restart: always
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:1337
    networks:
      - pwa_network

networks:
  pwa_network:
    driver: bridge

volumes:
  postgres_data:
